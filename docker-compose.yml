version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_projetotcs
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: banco_projeto
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: